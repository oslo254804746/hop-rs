[workspace]
members = [
    "crates/hop-core",
    "crates/hop-server",
]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["macros", "multipart"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
glob = "0.3"
hkdf = "0.12"
hmac = "0.12"
http = "1.3"
nucleo-matcher = "0.3"
rand_core = "0.6"
ratatui = "0.29"
russh = { version = "0.61.1", default-features = false, features = ["async-trait", "ring", "rsa", "flate2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
serde_yaml = "0.9"
sha2 = "0.10"
subtle = "2.6"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "uuid"] }
tempfile = "3.10"
termwiz = "0.23"
thiserror = "2.0"
tokio = { version = "1.45", features = ["full"] }
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
zeroize = "1.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
