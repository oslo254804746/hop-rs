api_version: hop/v1alpha1

# This file has no secrets, so it can be validated as-is. Add credentials and
# Access Keys before using it for a real deployment. See
# docs/configuration.zh-CN.md for the complete resource schema.
assets:
  example-ssh:
    type: ssh
    host: 192.168.1.20
    port: 22
    description: SSH target without a managed credential

  example-tcp:
    type: tcp
    host: 192.168.1.30
    port: 3389
    description: Generic TCP target
