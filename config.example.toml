[server]
# SSH entrypoint exposed to OpenSSH clients.
ssh_listen = "0.0.0.0:2222"

[api]
# The core SSH/TCP path does not require HTTP. When enabled, token_file must
# already exist. Keep the listener on loopback unless a protected remote API is
# intentional; non-loopback listeners require an explicit CORS allowlist.
enabled = false
listen = "127.0.0.1:8083"
token_file = "./hop-api.token"
cors_allowlist = []

[database]
# Relative paths are resolved from the process working directory, such as
# /var/lib/hop when using the sample systemd service.
path = "./hop.db"

[ssh]
# Hop creates an Ed25519 Host Key at this path when the file is missing. Keep
# the file across restarts so clients see a stable server identity.
host_key_file = "./hop_host_key"
host_key_type = "ed25519"
# Empty text disables the authentication banner.
banner = "Welcome to Hop"
# Seconds between SSH keepalives. Zero disables them.
keepalive_interval = 30
# Timeout in seconds for managed outbound SSH connections.
connect_timeout = 10
# ProxyJump and local forwarding may reach only authorized Catalog assets.
proxy_policy = "assets_only"

[security]
# Relative paths use the same working-directory base as database.path.
# Hop creates the Master Key when missing. Back it up with hop.db because
# stored target credentials cannot be decrypted without it.
master_key_file = "./hop.secret"

[inventory]
# Resource manifests are applied to SQLite at startup. A source with watch=true
# is reapplied after a stable file change. See docs/configuration.zh-CN.md.
sources = []

[runtime]
temp_dir = "/tmp/hop"
# RUST_LOG overrides this value when the environment variable is set.
log_level = "info"
# Finished sessions are pruned at startup. Zero disables automatic pruning.
session_retention_days = 30
